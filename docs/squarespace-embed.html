<!-- The Runway live tracker. Paste into a Squarespace Code block in the #track section. -->
<iframe id="runway-tracker" src="https://mrwayne-vfx.github.io/runway/follow.html?embed=1" title="The Runway live tracker" style="width:100%;max-width:520px;display:block;margin:0 auto;border:0;height:1600px" loading="lazy" allow="clipboard-write"></iframe>
<script>(function(){var f=document.getElementById("runway-tracker");window.addEventListener("message",function(e){if(e.origin!=="https://mrwayne-vfx.github.io"||!e.data||typeof e.data!=="object")return;if(e.data.runwayHeight)f.style.height=e.data.runwayHeight+"px";if(e.data.runwayTop)f.scrollIntoView({behavior:"smooth",block:"start"});});})();</script>
